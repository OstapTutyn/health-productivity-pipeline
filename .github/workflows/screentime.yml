name: Screen Time Transformation (Bronze -> Silver)

on:
  schedule:
    # Запуск щодня о 4:00 ранку (за UTC, або налаштуй під свій час)
    - cron: '0 2 * * *'
  workflow_dispatch: # Дозволяє запускати вручну з вкладки Actions у гіхабі

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Screentime Transformation Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/transformation/screentime_to_events.py