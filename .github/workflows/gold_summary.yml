name: Gold Summary Pipeline

on:
  schedule:
    - cron: '0 4 * * *'  # Щодня о 04:00 UTC (після завершення всіх інших нічних пайплайнів)
  workflow_dispatch:

jobs:
  run-gold-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run Gold Summary Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/gold/build_summary.py