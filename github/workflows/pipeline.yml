name: Personal Routine Data Pipeline

on:
  schedule:
    - cron: '0 12 * * *' # Щодня о 12:00 UTC
  workflow_dispatch: # Дозволяє запускати пайплайн вручну з вкладки Actions на GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python src/ingestion/google_fit_ingest.py
          python src/ingestion/iphone_ingest.py
          python src/ingestion/music_ingest.py
          python src/ingestion/notion_ingest.py
          python src/ingestion/screentime_ingest.py

      - name: Run Transformation Scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/transformation/health_transform.py
          python src/transformation/music_to_silver.py
          python src/transformation/notion_transform.py
          python src/transformation/screentime_to_events.py
          python src/transformation/screentime_to_hourly.py